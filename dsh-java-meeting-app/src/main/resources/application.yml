server:
  port: 8104

spring:
  application:
    name: dsh-java-meeting
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
  jackson:
    default-property-inclusion: non_null

dsh:
  meeting:
    data-directory: ${user.home}/.dsh-java-meeting
    command-timeout-seconds: 20
    max-transcripts: 200
    harness:
      base-url: ${DSH_HARNESS_BASE_URL:http://127.0.0.1:8090}
